name: E2E Tests (Playwright)

on:
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Start services with Docker Compose
        run: |
          cp .env.example .env || true
          docker compose up -d postgres redis minio mailpit nest-api
          echo "Waiting for API to be ready..."
          timeout 60 sh -c 'until curl -sf http://localhost:8081/api/v1/health; do sleep 2; done'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox

      - name: Start Next.js dev server
        working-directory: frontend
        run: npm run dev &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8081

      - name: Wait for Next.js
        run: timeout 30 sh -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
