<p style="margin:0 0 16px">Hello Admin,</p>
<p style="margin:0 0 20px">A product has dropped below the low-stock threshold.</p>
<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:18px 20px">
  <p style="margin:0 0 8px;font-size:13px;color:#92400e">Product</p>
  <p style="margin:0 0 16px;font-size:18px;font-weight:700;color:#78350f">{{productName}}</p>
  <p style="margin:0 0 8px;font-size:13px;color:#92400e">Units remaining</p>
  <p style="margin:0;font-size:24px;font-weight:700;color:#b45309">{{stock}}</p>
</div>
