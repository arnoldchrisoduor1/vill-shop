<p style="margin:0 0 16px">Hi <strong>{{customerName}}</strong>,</p>
<p style="margin:0 0 20px">We received your order and it is being prepared. You will receive another email once payment is confirmed.</p>
<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:20px">
  <p style="margin:0 0 8px;font-size:13px;color:#64748b">Order number</p>
  <p style="margin:0 0 16px;font-size:20px;font-weight:700;color:#0f172a">{{orderNumber}}</p>
  <p style="margin:0 0 8px;font-size:13px;color:#64748b">Order total</p>
  <p style="margin:0;font-size:18px;font-weight:700;color:#00b5b8">{{total}}</p>
</div>
<p style="margin:0;color:#64748b;font-size:14px">If you have not completed payment yet, please return to checkout to finish your purchase.</p>
