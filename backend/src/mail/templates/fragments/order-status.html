<p style="margin:0 0 16px">Hi <strong>{{customerName}}</strong>,</p>
<p style="margin:0 0 20px">{{statusMessage}}</p>
<div style="background:#f8fafc;border-left:4px solid {{accentColor}};border-radius:8px;padding:16px 18px;margin-bottom:16px">
  <p style="margin:0 0 6px;font-size:13px;color:#64748b">Order number</p>
  <p style="margin:0 0 12px;font-size:18px;font-weight:700;color:#0f172a">{{orderNumber}}</p>
  <p style="margin:0 0 6px;font-size:13px;color:#64748b">Current status</p>
  <p style="margin:0;font-size:15px;font-weight:600;color:{{accentColor}}">{{statusLabel}}</p>
</div>
