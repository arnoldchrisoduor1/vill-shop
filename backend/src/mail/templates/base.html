<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <title>{{title}}</title>
  <!--[if mso]><style>body, table, td { font-family: Arial, sans-serif !important; }</style><![endif]-->
</head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <span style="display:none!important;visibility:hidden;opacity:0;height:0;width:0;overflow:hidden">{{preheader}}</span>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f1f5f9;padding:32px 16px">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,0.08)">
          <tr>
            <td style="background:linear-gradient(135deg,#00b5b8 0%,#008b8e 100%);padding:32px 28px;text-align:center">
              <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.82)">{{eyebrow}}</p>
              <h1 style="margin:0;font-size:28px;line-height:1.2;color:#ffffff;font-weight:700">{{headline}}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 28px;color:#334155;font-size:15px;line-height:1.6">
              {{bodyContent}}
              {{ctaSection}}
            </td>
          </tr>
          <tr>
            <td style="background:#f8fafc;padding:24px 28px;text-align:center;border-top:1px solid #e2e8f0">
              <p style="margin:0 0 6px;font-size:13px;color:#64748b">Need help? Contact us at {{supportEmail}}</p>
              <p style="margin:0;font-size:12px;color:#94a3b8">&copy; {{year}} Vill Shop. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
