services:
  postgres:
    ports:
      - "127.0.0.1:15432:5432"

  redis:
    ports:
      - "127.0.0.1:16379:6379"

  minio:
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"

  mailpit:
    profiles:
      - dev

  minio-setup:
    environment:
      - MINIO_ENDPOINT=http://minio:9000

  nest-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: npm run start:prod
    volumes: []
    environment:
      NODE_ENV: production
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: villshop
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: villshop
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: villshop
      PESAPAL_ENV: live
      FRONTEND_URL: https://shop.villa-allegra.com
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:18081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: https://shop.villa-allegra.com/api
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:13001:3000"
    depends_on:
      - nest-api