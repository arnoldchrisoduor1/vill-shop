name: villa-shop

x-api-env: &api-env
  NODE_ENV: production
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USERNAME: villshop
  DB_PASSWORD: ${DB_PASSWORD}
  DB_DATABASE: villshop
  REDIS_HOST: redis
  REDIS_PORT: 6379
  JWT_SECRET: ${JWT_SECRET}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASS: ${SMTP_PASS}
  SMTP_FROM: ${SMTP_FROM}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: villshop
  PESAPAL_CONSUMER_KEY: ${PESAPAL_CONSUMER_KEY}
  PESAPAL_CONSUMER_SECRET: ${PESAPAL_CONSUMER_SECRET}
  PESAPAL_ENV: ${PESAPAL_ENV:-production}
  PESAPAL_IPN_ID: ${PESAPAL_IPN_ID:-}
  PESAPAL_SIMULATE: ${PESAPAL_SIMULATE:-false}
  PESAPAL_USERNAME: ${PESAPAL_USERNAME:-}
  PUBLIC_URL: ${PUBLIC_URL:-https://shop.villa-allegra.com}
  FRONTEND_URL: ${FRONTEND_URL:-https://shop.villa-allegra.com}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: villshop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: villshop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U villshop']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 20s
      retries: 3

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb local/villshop --ignore-existing;
      mc anonymous set public local/villshop/products;
      echo 'MinIO bucket ready';
      "

  # One-off: run migrations without starting the API
  # docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      <<: *api-env
    command: node dist/database/data-source.js run
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles:
      - tools

  # One-off: seed feature flags + hero slide (first deploy only)
  # docker compose -f docker-compose.prod.yml run --rm seed
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      <<: *api-env
    command: node dist/database/seeds/seed.js
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles:
      - tools

  nest-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      <<: *api-env
      PORT: 8081
    ports:
      - "127.0.0.1:18081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Entrypoint runs migrations automatically, then starts the API

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: https://shop.villa-allegra.com/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:13001:3000"
    depends_on:
      - nest-api

volumes:
  postgres_data:
  redis_data:
  minio_data:
